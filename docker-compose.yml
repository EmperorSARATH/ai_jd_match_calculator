services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres

    environment:
      POSTGRES_DB: ai_lab
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: